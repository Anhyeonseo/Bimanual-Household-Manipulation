name: Software contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hardware-free:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/host.txt
      - name: Install host test dependencies
        run: python -m pip install -r requirements/host.txt
      - name: Test arm communication and household task plans
        run: python -m pytest -c config/pytest.ini --rootdir=. -q
      - name: Validate firmware protocol sources
        run: |
          python tools/run/validate_protocol_manifest.py
          python tools/setup/firmware/generate_protocol_header.py --check
      - name: Build and test firmware core on host
        run: |
          cmake -S firmware/stm32_actuator -B build/stm32_actuator-host
          cmake --build build/stm32_actuator-host --parallel 2
          ctest --test-dir build/stm32_actuator-host --output-on-failure
      - name: Generate a non-executable fetch plan
        env:
          PYTHONPATH: ros2_ws/src/home_robot_tasks
        run: |
          python -m home_robot_tasks.cli --world config/home.example.json --request config/fetch_remote.example.json > fetch-plan.json
          python -c "import json; p=json.load(open('fetch-plan.json')); assert p['mode']=='plan_only' and not p['executable'] and not p['motion_authorized'] and not p['physical_task_completed']"
