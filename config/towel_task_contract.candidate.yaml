commissioning_gates:
  - measure mass before Isaac S1 material fitting or any dynamic cloth primitive
  - validate towel-table slip before friction-dependent drag or fold execution
  - commission automatic jaw opening, close-to-contact, and residual thresholds
  - validate perception candidate limits on a held-out towel dataset
  - independently validate top and wrist camera calibration
  - measure each hardware limit before the primitive that consumes it
  - pass primitive plan-only and validate-only gates
  - execute each primitive supervised once before integrated motion

