fold_policy:
  strategy: bimanual_first_then_single_arm_second
  first_axis: workcell_x
  first_direction: robot_near_to_far
  first_coordinate_direction: x_negative_to_positive
  first_arm_assignment: left_to_high_y_right_to_low_y
  first_primitive: bimanual_edge_pair
  first_correction_primitives:
    - micro_drag
    - lift_pull_place
  maximum_first_fold_corrections: 2
  correction_envelope_mm: 30.0
  require_clear_reobservation_after_each_attempt: true
  second_axis: workcell_y
  second_direction_candidates:
    - right_to_left
    - left_to_right
  second_coordinate_direction_by_candidate:
    right_to_left: y_negative_to_positive
    left_to_right: y_positive_to_negative
  second_primitive: single_arm_moving_edge_midpoint_multilayer
  second_active_arm_candidates:
    - right
    - left
  second_inactive_arm_policy: remain_at_observe_clear
  kinematic_contract:
    arm_dof: 5
    arbitrary_exact_6d_pose_claimed: false
    required_constraints:
      - tcp_xyz
      - jaw_opening_line_yaw
      - phase_semantic_approach_cone
      - full_6d_fk_recorded
  target_area_ratio_after_first_fold: 0.5
  target_area_ratio_after_second_fold: 0.25

perception_candidate_limits:
