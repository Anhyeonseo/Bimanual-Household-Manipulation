; 저장소 표준 시험 설정.
;
; `unittest discover`는 tests/ 77개 파일 중 unittest.TestCase를 쓰는 39개만 수집한다.
; 나머지는 pytest 형식(tmp_path fixture 포함)이므로 pytest로만 전부 실행된다.
;
; 전체 회귀 (600 tests):
;     source /opt/ros/jazzy/setup.bash
;     source ros2_ws/install/setup.bash
;     python3 -m pytest -q
;
; ROS overlay(`ros2_ws/install/setup.bash`)를 source하지 않으면
; ament_index가 `single_arm_bridge` package를 찾지 못해
; tests/test_moveit_external_execution.py의 4개가 실패한다.
; /opt/ros/jazzy만 source하면 548 collected + 7 collection error가 된다.

[pytest]
testpaths = tests ros2_ws/src/single_arm_bridge/test
pythonpath = ros2_ws/src/single_arm_bridge tools
